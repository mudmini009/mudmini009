      <polygon points="390,19.5 396,23 390,26.5" fill="#C9D1D9"/>

      <rect x="396" y="0" width="84" height="46" fill="#E6EDF3" stroke="#E6EDF3" stroke-width="1.1"/>
      <text x="438" y="19" text-anchor="middle" fill="#0D1117" font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="9.2" font-weight="800">04 SHIP</text>
